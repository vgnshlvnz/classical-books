<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grantha Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1119; --panel:#161926; --raise:#1e2233; --line:#2a2f45;
  --ink:#e6e3da; --dim:#8e93ab; --faint:#5d6379;
  --gold:#d9a441; --lapis:#7ba3d8; --rose:#c98a8a;
  --shloka-bg:#171c2c; --shloka-edge:#d9a441;
  --fs:17px; --measure:64ch;
}
html[data-theme="day"]{
  --bg:#f7f4ec; --panel:#efeade; --raise:#e6e0d0; --line:#d6cfba;
  --ink:#22201b; --dim:#5f5a4e; --faint:#8b8574;
  --gold:#9a6f14; --lapis:#3b5f92; --rose:#8d4f4f;
  --shloka-bg:#efe9d8; --shloka-edge:#9a6f14;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:Spectral,Georgia,serif; font-size:var(--fs); line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.deva{font-family:"Noto Serif Devanagari",serif;line-height:2.05}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:300px 1fr;height:100%}
aside{
  background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;
}
main{overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:var(--measure);margin:0 auto;padding:56px 32px 40vh}

/* ---------- sidebar ---------- */
.brand{padding:20px 20px 14px;border-bottom:1px solid var(--line)}
.brand h1{
  margin:0;font-family:"IBM Plex Sans",sans-serif;font-size:15px;
  font-weight:600;letter-spacing:.01em;
}
.brand .sub{color:var(--faint);font-size:12.5px;margin-top:2px}

.search{padding:14px 16px;border-bottom:1px solid var(--line)}
.search input{
  width:100%;padding:9px 11px;background:var(--bg);
  border:1px solid var(--line);border-radius:3px;font-size:14px;
  font-family:"IBM Plex Sans",sans-serif;
}
.search input:focus{outline:2px solid var(--gold);outline-offset:-1px}
.search .hint{color:var(--faint);font-size:11.5px;margin-top:7px}

.filters{padding:12px 16px;border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:5px}
.chip{
  font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;
  padding:3px 9px;border:1px solid var(--line);border-radius:11px;
  color:var(--dim);
}
.chip[aria-pressed="true"]{
  border-color:var(--gold);color:var(--gold);background:rgba(217,164,65,.08);
}

nav{flex:1;overflow-y:auto;padding:8px 0 20px}
nav a{
  display:block;padding:5px 16px 5px 20px;color:var(--dim);
  text-decoration:none;font-size:14px;border-left:2px solid transparent;
}
nav a:hover{color:var(--ink);background:var(--raise)}
nav a.on{color:var(--gold);border-left-color:var(--gold)}
nav .pg{color:var(--faint);font-size:11.5px;font-family:"IBM Plex Sans",sans-serif}

.foot{padding:12px 16px;border-top:1px solid var(--line);
  display:flex;gap:8px;align-items:center;
  font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:var(--dim)}
.foot button{
  padding:4px 9px;border:1px solid var(--line);border-radius:3px;color:var(--dim)}
.foot button:hover{border-color:var(--gold);color:var(--gold)}

/* ---------- content ---------- */
.pagemark{
  font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;color:var(--faint);
  border-bottom:1px solid var(--line);padding-bottom:7px;margin:44px 0 22px;
}
.pagemark:first-child{margin-top:0}
h2.head{
  font-family:"IBM Plex Sans",sans-serif;font-size:20px;font-weight:600;
  color:var(--ink);margin:34px 0 12px;line-height:1.35;
}
h3.head{font-family:"IBM Plex Sans",sans-serif;font-size:16.5px;
  font-weight:600;margin:26px 0 8px}
p{margin:0 0 15px}
.para{text-align:justify;hyphens:auto}
ul,ol{margin:0 0 15px;padding-left:22px}

/* the signature element: verses set as inscribed blocks */
.shloka{
  background:var(--shloka-bg);margin:26px 0;padding:20px 24px 18px;
  border-left:2px solid var(--shloka-edge);position:relative;
}
.shloka .orig{font-family:"Noto Serif Devanagari",serif;font-size:1.16em;
  line-height:2.05;white-space:pre-line;margin-bottom:11px}
.shloka .iast{color:var(--lapis);font-style:italic;font-size:.93em;
  white-space:pre-line;line-height:1.75;margin-bottom:12px}
.shloka .gloss{margin:0}
.shloka.hide-orig .orig,.shloka.hide-iast .iast,.shloka.hide-gloss .gloss{display:none}

.verse{font-style:italic;margin:18px 0 18px 14px;padding-left:16px;
  border-left:1px solid var(--line);white-space:pre-line}

table{border-collapse:collapse;width:100%;font-size:.88em;margin:14px 0 22px;
  font-family:"IBM Plex Sans",sans-serif}
th{background:var(--raise);text-align:left;padding:7px 10px;font-weight:600;
  font-size:.92em;border-bottom:1px solid var(--line)}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}

figure{margin:28px 0;text-align:center}
figcaption{font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;
  color:var(--dim);margin-top:9px}
.chart{max-width:340px;width:100%;height:auto}
.chart .cell{fill:none;stroke:var(--line);stroke-width:1.2}
.chart .rn{fill:var(--faint);font-size:11px;font-family:"IBM Plex Sans",sans-serif}
.chart .gr{fill:var(--gold);font-size:12.5px;font-family:"IBM Plex Sans",sans-serif}
.chart .hn{fill:var(--lapis);font-size:9px;font-family:"IBM Plex Sans",sans-serif;opacity:.6}

.notes{margin:22px 0;padding:13px 17px;background:var(--raise);
  border-left:2px solid var(--rose);font-size:.9em;color:var(--dim)}
.notes b{color:var(--rose);font-family:"IBM Plex Sans",sans-serif;
  font-size:11.5px;font-weight:600;display:block;margin-bottom:4px}

.unknown{border:1px dashed var(--rose);padding:9px;font-size:.85em;color:var(--rose)}

/* ---------- search results ---------- */
#results{padding:0 0 6px}
.hit{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.hit:hover{background:var(--raise)}
.hit .meta{font-family:"IBM Plex Sans",sans-serif;font-size:11px;
  color:var(--faint);margin-bottom:3px}
.hit .snip{font-size:13.5px;line-height:1.55;color:var(--dim)}
.hit mark{background:rgba(217,164,65,.26);color:var(--ink);padding:0 1px}
.empty{padding:22px 16px;color:var(--faint);font-size:13.5px}

/* ---------- library ---------- */
#library{padding:72px 32px 20vh;max-width:820px;margin:0 auto}
#library .lede{margin:0 0 8px;font-family:"IBM Plex Sans",sans-serif;
  font-size:26px;font-weight:600;letter-spacing:-.01em}
#library .blurb{color:var(--dim);margin:0 0 40px;max-width:56ch}
.shelf{display:grid;gap:2px}
.book{
  display:grid;grid-template-columns:1fr auto;gap:18px;align-items:baseline;
  padding:18px 20px;background:var(--panel);border-left:2px solid transparent;
  cursor:pointer;text-align:left;width:100%;
}
.book:hover{background:var(--raise);border-left-color:var(--gold)}
.book:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.book .t{font-size:19px;color:var(--ink);font-family:Spectral,serif}
.book .deva-t{font-family:"Noto Serif Devanagari",serif;font-size:17px;
  color:var(--gold);margin-left:10px}
.book .by{color:var(--dim);font-size:14px;margin-top:3px}
.book .st{font-family:"IBM Plex Sans",sans-serif;font-size:12px;
  color:var(--faint);white-space:nowrap;text-align:right}
#library .colophon{margin-top:44px;padding-top:20px;
  border-top:1px solid var(--line);color:var(--faint);font-size:13.5px;
  max-width:60ch}
.backlink{
  display:block;padding:10px 16px 10px 20px;border-bottom:1px solid var(--line);
  color:var(--dim);font-family:"IBM Plex Sans",sans-serif;font-size:13px;
  width:100%;text-align:left;
}
.backlink:hover{color:var(--gold)}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;background:var(--bg);display:grid;
  place-items:center;z-index:50;text-align:center;padding:24px}
#loader[hidden],#app[hidden]{display:none}
#loader .box{max-width:440px}
#loader h2{font-family:"IBM Plex Sans",sans-serif;font-weight:600;
  font-size:19px;margin:0 0 8px}
#loader p{color:var(--dim);font-size:14.5px}
#drop{border:1.5px dashed var(--line);border-radius:4px;padding:34px 20px;
  margin-top:20px;color:var(--dim);font-size:14px}
#drop.over{border-color:var(--gold);color:var(--gold)}
#loader label{color:var(--gold);text-decoration:underline;cursor:pointer}

@media (max-width:860px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:290px;z-index:20;
    transform:translateX(-100%);transition:transform .18s}
  aside.open{transform:none}
  #menu{position:fixed;top:12px;left:12px;z-index:30;background:var(--panel);
    border:1px solid var(--line);border-radius:3px;padding:7px 11px}
  .wrap{padding:64px 20px 40vh}
}
@media (min-width:861px){#menu{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;
  scroll-behavior:auto!important}}
</style>
</head>
<body>

<button id="menu" aria-label="Toggle sidebar">☰</button>

<div id="library" hidden></div>

<div id="app" hidden>
  <aside id="side">
    <button class="backlink" id="back" hidden>← All texts</button>
    <div class="brand">
      <h1 id="title">Grantha</h1>
      <div class="sub" id="subtitle">no text loaded</div>
    </div>

    <div class="search">
      <input id="q" type="search" placeholder="Search  (press /)"
             autocomplete="off" spellcheck="false">
      <div class="hint">Diacritics ignored — “kalangani” finds कालाङ्गानि</div>
    </div>

    <div class="filters" id="filters">
      <button class="chip" data-f="orig"  aria-pressed="true">Devanagari</button>
      <button class="chip" data-f="iast"  aria-pressed="true">IAST</button>
      <button class="chip" data-f="gloss" aria-pressed="true">Translation</button>
      <button class="chip" data-f="para"  aria-pressed="true">Commentary</button>
      <button class="chip" data-f="fig"   aria-pressed="true">Charts</button>
      <button class="chip" data-f="notes" aria-pressed="true">Notes</button>
    </div>

    <nav id="toc"></nav>
    <div id="results" hidden></div>

    <div class="foot">
      <button id="theme">Day</button>
      <button id="smaller">A−</button>
      <button id="bigger">A+</button>
      <span id="count"></span>
    </div>
  </aside>

  <main id="main"><div class="wrap" id="doc"></div></main>
</div>

<div id="loader">
  <div class="box">
    <h2>Open a grantha</h2>
    <p>A JSON file produced by <code>jbook2.py --dump-json</code>.</p>
    <div id="drop">
      Drop the file here, or
      <label>choose it<input id="file" type="file" accept=".json" hidden></label>
    </div>
    <p id="lmsg" style="margin-top:14px"></p>
  </div>
</div>

<script>
"use strict";

/* ================= data ================= */
let PAGES = [], INDEX = [], FILT = {orig:1,iast:1,gloss:1,para:1,fig:1,notes:1};

const RASHI = ["","Mesha","Vrishabha","Mithuna","Karka","Simha","Kanya",
  "Tula","Vrishchika","Dhanu","Makara","Kumbha","Meena"];

/* fold diacritics + case so "kalangani" matches "kālāṅgāni" */
function fold(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[ḷḹ]/g,"l").replace(/[ṛṝ]/g,"r").replace(/[ṭḍ]/g,"d")
    .replace(/[ṇñṅ]/g,"n").replace(/[śṣ]/g,"s").replace(/ḥ/g,"h")
    .replace(/ṃ/g,"m");
}

const esc = s => (s||"").replace(/[&<>"]/g,
  c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ================= markdown table ================= */
function mdTable(src){
  const rows = (src||"").trim().split("\n")
    .map(r=>r.trim()).filter(r=>r.startsWith("|"));
  if(rows.length < 2) return `<p class="para">${esc(src)}</p>`;
  const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  const head = cells(rows[0]);
  const body = rows.slice(1).filter(r=>!/^\|[\s:|-]+\|?$/.test(r)).map(cells);
  return `<table><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>
    </thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`)
    .join("")}</tr>`).join("")}</tbody></table>`;
}

function mdList(src){
  const items = (src||"").split("\n").map(l=>l.replace(/^\s*[-*\d.]+\s*/,"").trim())
    .filter(Boolean);
  return `<ul>${items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`;
}

/* ================= kundali chart =================
   North Indian: square + both diagonals + inner diamond on the side
   midpoints. House 1 is the top-centre diamond; houses run ANTICLOCKWISE. */
const CELL = [
  null,
  {x:150,y: 68}, {x: 74,y: 26}, {x: 26,y: 74}, {x: 74,y:150},
  {x: 26,y:226}, {x: 74,y:274}, {x:150,y:232}, {x:226,y:274},
  {x:274,y:226}, {x:226,y:150}, {x:274,y: 74}, {x:226,y: 26}
];

function chart(houses){
  const by = {};
  (houses||[]).forEach(h=>{ if(h && h.house) by[h.house]=h; });
  let g = "";
  for(let h=1; h<=12; h++){
    const c = CELL[h], d = by[h];
    g += `<text class="hn" x="${c.x}" y="${c.y-19}" text-anchor="middle">${h}</text>`;
    if(d){
      const rn = d.rashi_no || "";
      const rs = d.rashi || RASHI[rn] || "";
      g += `<text class="rn" x="${c.x}" y="${c.y-6}" text-anchor="middle">${esc(String(rn))} ${esc(rs)}</text>`;
      const gr = (d.grahas||"").trim();
      if(gr && gr !== "—"){
        const parts = gr.split(/[,;]\s*/).filter(Boolean);
        parts.slice(0,3).forEach((p,i)=>{
          g += `<text class="gr" x="${c.x}" y="${c.y+11+i*13}" text-anchor="middle">${esc(p)}</text>`;
        });
      }
    }
  }
  return `<svg class="chart" viewBox="-4 -4 308 308" role="img" aria-label="Kundali chart">
    <rect class="cell" x="0" y="0" width="300" height="300"/>
    <path class="cell" d="M0 0 L300 300 M300 0 L0 300"/>
    <path class="cell" d="M150 0 L300 150 L150 300 L0 150 Z"/>
    ${g}</svg>`;
}

function houseTable(houses){
  const rows = (houses||[]).slice().sort((a,b)=>(a.house||0)-(b.house||0));
  if(!rows.length) return "";
  return `<table><thead><tr><th>House</th><th>Rashi</th><th>Grahas</th></tr>
    </thead><tbody>${rows.map(h=>`<tr><td>${esc(String(h.house??""))}</td>
    <td>${esc(String(h.rashi_no??""))} ${esc(h.rashi||"")}</td>
    <td>${esc(h.grahas||"—")}</td></tr>`).join("")}</tbody></table>`;
}

/* ================= render ================= */
function renderPage(pg){
  const figs = {};
  (pg.figures||[]).forEach(f=>{ if(f && f.id!=null) figs[f.id]=f; });
  let out = `<div class="pagemark" id="p${pg.page}">Page ${pg.page}</div>`;

  for(const b of (pg.blocks||[])){
    const t = b && b.type;
    if(t === "heading"){
      const lv = Math.min(Math.max(b.level||2,2),3);
      out += `<h${lv} class="head">${esc(b.text||"")}</h${lv}>`;
    }
    else if(t === "para"){
      if(!FILT.para || !(b.text||"").trim()) continue;
      out += `<p class="para">${esc(b.text)}</p>`;
    }
    else if(t === "list"){
      if(!FILT.para) continue;
      out += mdList(b.text);
    }
    else if(t === "table"){
      out += mdTable(b.text);
    }
    else if(t === "verse"){
      out += `<div class="verse">${esc(b.text||"")}</div>`;
    }
    else if(t === "shloka"){
      const cls = ["shloka"];
      if(!FILT.orig)  cls.push("hide-orig");
      if(!FILT.iast)  cls.push("hide-iast");
      if(!FILT.gloss) cls.push("hide-gloss");
      let inner = "";
      if(b.original) inner += `<div class="orig">${esc(b.original)}</div>`;
      if(b.translit) inner += `<div class="iast">${esc(b.translit)}</div>`;
      if(b.text)     inner += `<p class="gloss">${esc(b.text)}</p>`;
      if(!inner) continue;
      out += `<div class="${cls.join(" ")}">${inner}</div>`;
    }
    else if(t === "figure"){
      if(!FILT.fig) continue;
      const f = figs[b.figure_id];
      if(!f) continue;
      out += `<figure>${f.kind==="kundali" && f.houses ? chart(f.houses) : ""}
        ${f.label?`<figcaption>${esc(f.label)}</figcaption>`:""}</figure>`;
      if(f.kind==="kundali" && f.houses) out += houseTable(f.houses);
    }
    else if(t){
      out += `<div class="unknown">unhandled block type “${esc(t)}”</div>`;
    }
  }

  const n = (pg.notes||"").trim();
  if(n && FILT.notes && !/^none\.?$/i.test(n)){
    out += `<div class="notes"><b>Note</b>${esc(n)}</div>`;
  }
  return out;
}

function renderAll(){
  const doc = document.getElementById("doc");
  doc.innerHTML = PAGES.map(renderPage).join("");
  buildToc();
}

/* ================= toc ================= */
function buildToc(){
  const nav = document.getElementById("toc");
  const items = [];
  PAGES.forEach(pg=>{
    (pg.blocks||[]).forEach(b=>{
      if(b.type==="heading" && (b.text||"").trim())
        items.push({text:b.text.trim(), page:pg.page});
    });
  });
  if(!items.length){
    PAGES.forEach((pg,i)=>{ if(i%10===0)
      items.push({text:"Page "+pg.page, page:pg.page}); });
  }
  nav.innerHTML = items.map(i=>
    `<a href="#p${i.page}" data-p="${i.page}">${esc(i.text)}
      <span class="pg">${i.page}</span></a>`).join("");
}

/* ================= search ================= */
function buildIndex(){
  INDEX = [];
  PAGES.forEach(pg=>{
    (pg.blocks||[]).forEach(b=>{
      const fields = [];
      if(b.original) fields.push(["Devanagari", b.original]);
      if(b.translit) fields.push(["IAST", b.translit]);
      if(b.text)     fields.push([b.type==="shloka"?"Translation":"Commentary", b.text]);
      fields.forEach(([label,txt])=>{
        INDEX.push({page:pg.page, label, text:txt, k:fold(txt)});
      });
    });
    if((pg.notes||"").trim())
      INDEX.push({page:pg.page,label:"Note",text:pg.notes,k:fold(pg.notes)});
  });
}

function snippet(text, k, needle){
  const i = k.indexOf(needle);
  if(i < 0) return esc(text.slice(0,140));
  const a = Math.max(0, i-52), b = Math.min(text.length, i+needle.length+80);
  return (a>0?"…":"") + esc(text.slice(a,i)) +
    "<mark>" + esc(text.slice(i, i+needle.length)) + "</mark>" +
    esc(text.slice(i+needle.length, b)) + (b<text.length?"…":"");
}

function search(qs){
  const box = document.getElementById("results"),
        nav = document.getElementById("toc");
  const needle = fold(qs.trim());
  if(needle.length < 2){
    box.hidden = true; nav.hidden = false; return;
  }
  nav.hidden = true; box.hidden = false;
  const hits = [];
  for(const e of INDEX){
    if(e.k.includes(needle)){
      hits.push(e);
      if(hits.length >= 300) break;
    }
  }
  box.innerHTML = hits.length
    ? hits.map(h=>`<div class="hit" data-p="${h.page}">
        <div class="meta">page ${h.page} · ${h.label}</div>
        <div class="snip">${snippet(h.text,h.k,needle)}</div></div>`).join("")
    : `<div class="empty">Nothing found for “${esc(qs)}”.</div>`;
}

/* ================= wiring ================= */
function boot(data){
  PAGES = Array.isArray(data) ? data : (data.pages || []);
  if(!PAGES.length) throw new Error("no pages in that file");
  buildIndex();
  renderAll();
  document.getElementById("subtitle").textContent =
    `${PAGES.length} pages · ${INDEX.length} passages`;
  document.getElementById("count").textContent = PAGES.length + " pp";
  document.getElementById("loader").hidden = true;
  document.getElementById("app").hidden = false;
  if(location.hash) jump(location.hash.replace(/^#p?/,""));
}

function jump(page){
  const el = document.getElementById("p"+page);
  if(el){
    el.scrollIntoView({block:"start"});
    const h = parseHash();
    history.replaceState(null,"",
      h.b ? "#b="+encodeURIComponent(h.b)+"&p="+page : "#p"+page);
    document.getElementById("side").classList.remove("open");
  }
}

document.getElementById("q").addEventListener("input", e=>search(e.target.value));

document.getElementById("results").addEventListener("click", e=>{
  const h = e.target.closest(".hit"); if(h) jump(h.dataset.p);
});
document.getElementById("toc").addEventListener("click", e=>{
  const a = e.target.closest("a");
  if(a){ e.preventDefault(); jump(a.dataset.p);
    document.querySelectorAll("#toc a").forEach(x=>x.classList.remove("on"));
    a.classList.add("on"); }
});

document.getElementById("filters").addEventListener("click", e=>{
  const c = e.target.closest(".chip"); if(!c) return;
  const on = c.getAttribute("aria-pressed") === "true";
  c.setAttribute("aria-pressed", String(!on));
  FILT[c.dataset.f] = !on;
  localStorage.setItem("filt", JSON.stringify(FILT));
  renderAll();
});

document.getElementById("theme").addEventListener("click", ()=>{
  const day = document.documentElement.getAttribute("data-theme") === "day";
  document.documentElement.setAttribute("data-theme", day ? "" : "day");
  document.getElementById("theme").textContent = day ? "Day" : "Night";
  localStorage.setItem("theme", day ? "" : "day");
});
function setSize(px){
  px = Math.min(23, Math.max(14, px));
  document.documentElement.style.setProperty("--fs", px+"px");
  localStorage.setItem("fs", px);
}
document.getElementById("bigger").onclick = ()=>
  setSize(parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue("--fs"))+1);
document.getElementById("smaller").onclick = ()=>
  setSize(parseInt(getComputedStyle(document.documentElement)
    .getPropertyValue("--fs"))-1);

document.getElementById("menu").onclick = ()=>
  document.getElementById("side").classList.toggle("open");

addEventListener("keydown", e=>{
  if(e.key === "/" && document.activeElement.id !== "q"){
    e.preventDefault(); document.getElementById("q").focus();
  }
  if(e.key === "Escape"){
    const q = document.getElementById("q"); q.value = ""; search(""); q.blur();
  }
});

/* restore preferences */
(function(){
  const t = localStorage.getItem("theme");
  if(t === "day"){ document.documentElement.setAttribute("data-theme","day");
    document.getElementById("theme").textContent = "Night"; }
  const fs = localStorage.getItem("fs"); if(fs) setSize(parseInt(fs));
  const f = localStorage.getItem("filt");
  if(f){ try{ Object.assign(FILT, JSON.parse(f));
    document.querySelectorAll(".chip").forEach(c=>
      c.setAttribute("aria-pressed", String(!!FILT[c.dataset.f]))); }catch(e){} }
})();

/* ---------- library ---------- */
let BOOKS = [];

function libraryHTML(){
  const shelf = BOOKS.map((b,i)=>`
    <button class="book" data-i="${i}">
      <span>
        <span class="t">${esc(b.title||b.id||"Untitled")}</span>${
          b.deva ? `<span class="deva-t">${esc(b.deva)}</span>` : ""}
        ${b.author||b.note ? `<div class="by">${
          esc([b.author,b.note].filter(Boolean).join(" · "))}</div>` : ""}
      </span>
      <span class="st">${b.pages?esc(b.pages+" pp"):""}${
        b.verses?"<br>"+esc(b.verses+" verses"):""}</span>
    </button>`).join("");
  return `<h1 class="lede">Classical Jyotish texts</h1>
    <p class="blurb">Sanskrit verses with transliteration and English
      translation. Choose a text to read, or search within it once open.</p>
    <div class="shelf">${shelf}</div>
    <p class="colophon">The verses are in the public domain. Translations
      were produced with machine assistance and reviewed. These follow one
      printed recension and are not critical editions — readings may differ
      from other editions.</p>`;
}

function showLibrary(){
  document.getElementById("app").hidden = true;
  document.getElementById("loader").hidden = true;
  const lib = document.getElementById("library");
  lib.innerHTML = libraryHTML();
  lib.hidden = false;
  history.replaceState(null,"","#");
  document.title = "Classical Jyotish texts";
}

document.getElementById("library").addEventListener("click", e=>{
  const b = e.target.closest(".book");
  if(b) openBook(BOOKS[+b.dataset.i]);
});

document.getElementById("back").onclick = showLibrary;

async function openBook(book, page){
  if(!book) return;
  const lib = document.getElementById("library");
  lib.innerHTML = `<p class="blurb">Loading ${esc(book.title||book.id)}…</p>`;
  try{
    const r = await fetch(book.file);
    if(!r.ok) throw new Error("HTTP " + r.status);
    boot(await r.json());
    document.getElementById("title").textContent = book.title || book.id;
    document.getElementById("back").hidden = BOOKS.length < 2;
    lib.hidden = true;
    document.title = (book.title||book.id) + " — Jyotish texts";
    history.replaceState(null,"","#b=" + encodeURIComponent(book.id) +
      (page ? "&p=" + page : ""));
    if(page) jump(page);
  }catch(err){
    lib.innerHTML = libraryHTML() +
      `<p class="colophon">Could not open ${esc(book.title||book.id)}:
       ${esc(err.message)}</p>`;
  }
}

/* ---------- file fallback, for local use without a manifest ---------- */
const msg = document.getElementById("lmsg");
function loadFile(text, name){
  try{
    boot(JSON.parse(text));
    if(name) document.getElementById("title").textContent =
      name.replace(/\.json$/i,"").replace(/[-_]/g," ");
  }catch(err){ msg.textContent = "Could not read that file: " + err.message; }
}

document.getElementById("file").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  f.text().then(t=>loadFile(t, f.name));
});

const drop = document.getElementById("drop");
["dragenter","dragover"].forEach(n=>drop.addEventListener(n, e=>{
  e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(n=>drop.addEventListener(n, e=>{
  e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e=>{
  const f = e.dataTransfer.files[0];
  if(f) f.text().then(t=>loadFile(t, f.name));
});

/* ---------- start ---------- */
function parseHash(){
  const h = location.hash.replace(/^#/,"");
  const out = {};
  h.split("&").forEach(kv=>{
    const [k,v] = kv.split("=");
    if(k) out[k] = decodeURIComponent(v||"");
  });
  return out;
}

addEventListener("hashchange", ()=>{
  const h = parseHash();
  if(!h.b){ showLibrary(); return; }
  const cur = document.getElementById("title").textContent;
  const bk = BOOKS.find(x=>x.id === h.b);
  if(!bk) return;
  if(bk.title === cur || bk.id === cur){        // same book, just move
    if(h.p) jump(h.p);
  } else {
    openBook(bk, h.p);
  }
});

(async function start(){
  try{
    const r = await fetch("books.json");
    if(r.ok){
      BOOKS = await r.json();
      if(Array.isArray(BOOKS) && BOOKS.length){
        const h = parseHash();
        if(h.b){
          const found = BOOKS.find(x=>x.id === h.b);
          if(found){ openBook(found, h.p); return; }
        }
        if(BOOKS.length === 1){ openBook(BOOKS[0], h.p); return; }
        showLibrary();
        return;
      }
    }
  }catch(e){}

  /* no manifest — fall back to a single conventional filename */
  for(const n of ["grantha.json","data.json"]){
    try{
      const r = await fetch(n);
      if(r.ok){ loadFile(await r.text(), n); return; }
    }catch(e){}
  }
  msg.textContent = "";
})();
</script>
</body>
</html>
